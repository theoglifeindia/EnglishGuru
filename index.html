<head>

  <title>English Guru - Spoken English Coach</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
    }
    .hindi-text {
      font-family: 'Noto Sans Devanagari', sans-serif;
    }
    .bg-pattern {
      background-color: #f8fafc;
      background-image: radial-gradient(#e2e8f0 2px, transparent 2px);
      background-size: 24px 24px;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    
    /* Animation Utilities */
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slide-up {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-in {
      animation-duration: 0.5s;
      animation-fill-mode: forwards;
    }
    .fade-in {
      animation-name: fade-in;
    }
    .slide-in-from-bottom-4 {
      animation-name: slide-up;
    }
  </style>
